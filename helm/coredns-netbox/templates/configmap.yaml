apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "coredns-netbox.fullname" . }}
  labels:
    {{- include "coredns-netbox.labels" . | nindent 4 }}
data:
  Corefile: |
    . {
        auto {
            directory {{ .Values.zoneDir }} db\.(.*) {1}
            reload 10s
        }
        {{- if .Values.netboxPlugin.enabled }}
        {{- if empty .Values.netboxPlugin.zones }}
        {{- fail "netboxPlugin.zones must be set when netboxPlugin.enabled is true (list the zones you are authoritative for)" }}
        {{- end }}
        netbox{{ range .Values.netboxPlugin.zones }} {{ . }}{{ end }} {
            token {$NETBOX_TOKEN}
            url {{ .Values.netbox.url }}/api/ipam/ip-addresses
            fallthrough
        }
        {{- end }}
        {{- if .Values.transfer.to }}
        transfer {
            {{- range .Values.transfer.to }}
            to {{ . }}
            {{- end }}
        }
        {{- end }}
        forward . {{ range .Values.forwardServers }}{{ . }} {{ end }}
        cache 30
        log
        errors
        health :8080
        ready :8181
        {{- if .Values.metrics.enabled }}
        prometheus :{{ .Values.metrics.port }}
        {{- end }}
    }
{{- if .Values.secondary.enabled }}
  Corefile-secondary: |
    {{- range .Values.secondary.zones }}
    {{ . }} {
        secondary {
            {{- range $.Values.secondary.transferFrom }}
            transfer from {{ . }}
            {{- end }}
        }
    }
    {{- end }}
    . {
        forward . {{ range $.Values.forwardServers }}{{ . }} {{ end }}
        cache 30
        log
        errors
        health :8080
        ready :8181
    }
{{- end }}
