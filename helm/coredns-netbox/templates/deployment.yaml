apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "coredns-netbox.fullname" . }}
  labels:
    {{- include "coredns-netbox.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "coredns-netbox.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.hostPort.enabled }}
  updateStrategy:
    type: OnDelete
  {{- end }}
  selector:
    matchLabels:
      {{- include "coredns-netbox.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: primary
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "coredns-netbox.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: primary
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "coredns-netbox.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.sidecar.standalone }}
        - name: zone-init
          image: "{{ .Values.sidecar.image }}:{{ .Values.sidecar.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sidecar.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext.zoneInit | nindent 12 }}
          args: ["--fetch-from", {{ include "coredns-netbox.sidecarHTTPURL" . | quote }}]
          env:
            - name: ZONE_DIR
              value: {{ .Values.zoneDir | quote }}
          volumeMounts:
            - name: zones
              mountPath: {{ .Values.zoneDir }}
          resources:
            {{- toYaml .Values.resources.zoneInit | nindent 12 }}
        {{- else }}
        - name: zone-init
          image: "{{ .Values.sidecar.image }}:{{ .Values.sidecar.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sidecar.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext.zoneInit | nindent 12 }}
          args: ["--run-once"]
          env:
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "coredns-netbox.tokenSecretName" . }}
                  key: token
            - name: NETBOX_URL
              value: {{ .Values.netbox.url | quote }}
            - name: DISCOVERY_MODE
              value: {{ .Values.zoneDiscovery.mode | quote }}
            - name: ZONE_DEPTH
              value: {{ .Values.zoneDiscovery.depth | quote }}
            - name: ZONE_DIR
              value: {{ .Values.zoneDir | quote }}
            - name: TTL
              value: {{ .Values.ttl | quote }}
            - name: PRIMARY_NS
              value: {{ .Values.primaryNS | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: SOA_REFRESH
              value: {{ .Values.soa.refresh | quote }}
            - name: SOA_RETRY
              value: {{ .Values.soa.retry | quote }}
            - name: SOA_EXPIRE
              value: {{ .Values.soa.expire | quote }}
            - name: SOA_MINIMUM
              value: {{ .Values.soa.minimum | quote }}
            - name: NETBOX_PAGE_SIZE
              value: {{ .Values.pageSize | quote }}
            - name: NETBOX_MAX_CONCURRENCY
              value: {{ .Values.maxConcurrency | quote }}
            - name: ENABLE_REVERSE_ZONES
              value: {{ .Values.reverseZones.enabled | quote }}
            - name: REVERSE_ZONES_IPV4
              value: {{ join "," .Values.reverseZones.ipv4 | quote }}
            - name: REVERSE_ZONES_IPV6
              value: {{ join "," .Values.reverseZones.ipv6 | quote }}
            - name: DOMAIN_SUFFIX
              value: {{ .Values.domainSuffix | quote }}
            - name: STRIP_DC_LABEL
              value: {{ .Values.stripDCLabel | quote }}
            {{- if .Values.deviceNameParsers }}
            - name: DEVICE_NAME_PARSERS
              value: {{ join "\n" .Values.deviceNameParsers | quote }}
            - name: NAME_FORMAT_CANONICAL
              value: {{ .Values.nameFormats.canonical | quote }}
            {{- with .Values.nameFormats.aliases }}
            - name: NAME_FORMAT_ALIASES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.nameFormats.zone }}
            - name: NAME_FORMAT_ZONE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: BMC_INTERFACE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.bmc | quote }}
            - name: LOOPBACK_PATTERN
              value: {{ join "|" .Values.interfacePatterns.loopback | quote }}
            - name: DATAPLANE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.dataplane | quote }}
            - name: MGMT_VRF_PATTERN
              value: {{ join "|" .Values.interfacePatterns.mgmtVRF | quote }}
            - name: MGMT_INTERFACE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.management | quote }}
            {{- with .Values.sidecar.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: zones
              mountPath: {{ .Values.zoneDir }}
          resources:
            {{- toYaml .Values.resources.zoneInit | nindent 12 }}
        {{- end }}
      containers:
        - name: coredns
          image: "{{ .Values.coredns.image }}:{{ .Values.coredns.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.coredns.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext.coredns | nindent 12 }}
          args: ["-conf", "/etc/coredns/Corefile"]
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
              {{- if .Values.hostPort.enabled }}
              hostPort: 53
              {{- end }}
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
              {{- if .Values.hostPort.enabled }}
              hostPort: 53
              {{- end }}
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: ready
              containerPort: 8181
              protocol: TCP
            - name: grpc-reload
              containerPort: {{ .Values.coredns.reloadGRPCPort | default ":8054" | trimPrefix ":" | int }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: ready
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/coredns
              readOnly: true
            - name: zones
              mountPath: {{ .Values.zoneDir }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources.coredns | nindent 12 }}
        {{- if not .Values.sidecar.standalone }}
        - name: sidecar
          image: "{{ .Values.sidecar.image }}:{{ .Values.sidecar.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.sidecar.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext.sidecar | nindent 12 }}
          env:
            - name: NETBOX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "coredns-netbox.tokenSecretName" . }}
                  key: token
            - name: NETBOX_URL
              value: {{ .Values.netbox.url | quote }}
            - name: DISCOVERY_MODE
              value: {{ .Values.zoneDiscovery.mode | quote }}
            - name: ZONE_DEPTH
              value: {{ .Values.zoneDiscovery.depth | quote }}
            - name: ZONE_DIR
              value: {{ .Values.zoneDir | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.pollInterval | quote }}
            - name: TTL
              value: {{ .Values.ttl | quote }}
            - name: PRIMARY_NS
              value: {{ .Values.primaryNS | quote }}
            - name: ADMIN_EMAIL
              value: {{ .Values.adminEmail | quote }}
            - name: SOA_REFRESH
              value: {{ .Values.soa.refresh | quote }}
            - name: SOA_RETRY
              value: {{ .Values.soa.retry | quote }}
            - name: SOA_EXPIRE
              value: {{ .Values.soa.expire | quote }}
            - name: SOA_MINIMUM
              value: {{ .Values.soa.minimum | quote }}
            - name: NETBOX_PAGE_SIZE
              value: {{ .Values.pageSize | quote }}
            - name: NETBOX_MAX_CONCURRENCY
              value: {{ .Values.maxConcurrency | quote }}
            - name: ENABLE_REVERSE_ZONES
              value: {{ .Values.reverseZones.enabled | quote }}
            - name: REVERSE_ZONES_IPV4
              value: {{ join "," .Values.reverseZones.ipv4 | quote }}
            - name: REVERSE_ZONES_IPV6
              value: {{ join "," .Values.reverseZones.ipv6 | quote }}
            - name: DOMAIN_SUFFIX
              value: {{ .Values.domainSuffix | quote }}
            - name: STRIP_DC_LABEL
              value: {{ .Values.stripDCLabel | quote }}
            {{- if .Values.deviceNameParsers }}
            - name: DEVICE_NAME_PARSERS
              value: {{ join "\n" .Values.deviceNameParsers | quote }}
            - name: NAME_FORMAT_CANONICAL
              value: {{ .Values.nameFormats.canonical | quote }}
            {{- with .Values.nameFormats.aliases }}
            - name: NAME_FORMAT_ALIASES
              value: {{ join "\n" . | quote }}
            {{- end }}
            {{- with .Values.nameFormats.zone }}
            - name: NAME_FORMAT_ZONE
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: BMC_INTERFACE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.bmc | quote }}
            - name: LOOPBACK_PATTERN
              value: {{ join "|" .Values.interfacePatterns.loopback | quote }}
            - name: DATAPLANE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.dataplane | quote }}
            - name: MGMT_VRF_PATTERN
              value: {{ join "|" .Values.interfacePatterns.mgmtVRF | quote }}
            - name: MGMT_INTERFACE_PATTERN
              value: {{ join "|" .Values.interfacePatterns.management | quote }}
            - name: COREDNS_RELOAD_ADDRS
              value: {{ include "coredns-netbox.reloadAddrs" . | quote }}
            - name: COREDNS_RELOAD_TOKEN
              value: {{ .Values.sidecar.reloadToken | quote }}
            {{- with .Values.sidecar.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: sidecar-health
              containerPort: 8082
              protocol: TCP
              {{- if .Values.hostPort.sidecar }}
              hostPort: 8082
              {{- end }}
            - name: grpc
              containerPort: 8083
              protocol: TCP
              {{- if .Values.hostPort.sidecar }}
              hostPort: 8083
              {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: sidecar-health
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: zones
              mountPath: {{ .Values.zoneDir }}
          resources:
            {{- toYaml .Values.resources.sidecar | nindent 12 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "coredns-netbox.affinity" . | nindent 8 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "coredns-netbox.fullname" . }}
        {{- if .Values.zoneStorage.existingClaim }}
        - name: zones
          persistentVolumeClaim:
            claimName: {{ .Values.zoneStorage.existingClaim }}
        {{- else if not .Values.zoneStorage.persistent }}
        - name: zones
          emptyDir:
            sizeLimit: {{ .Values.zoneStorage.sizeLimit }}
        {{- end }}
  {{- if and .Values.zoneStorage.persistent (not .Values.zoneStorage.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: zones
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.zoneStorage.storageClass }}
        storageClassName: {{ .Values.zoneStorage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.zoneStorage.size }}
  {{- end }}
