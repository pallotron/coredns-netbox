# Internal ClusterIP service — all ports, for in-cluster use only
# (metrics scraping, health checks, gRPC zone injection, DNS within cluster)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coredns-netbox.fullname" . }}
  labels:
    {{- include "coredns-netbox.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: dns-udp
      port: {{ .Values.service.port }}
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: {{ .Values.service.port }}
      targetPort: dns-tcp
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    - name: sidecar-metrics
      port: 8082
      targetPort: sidecar-health
      protocol: TCP
    {{- end }}
    - name: grpc
      port: 8083
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "coredns-netbox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
{{- if .Values.service.external.enabled }}
---
# External service — DNS port only, for DC secondaries via Interconnect / Tailscale
apiVersion: v1
kind: Service
metadata:
  name: {{ include "coredns-netbox.fullname" . }}-external
  labels:
    {{- include "coredns-netbox.labels" . | nindent 4 }}
  {{- with .Values.service.external.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.external.type | default "LoadBalancer" }}
  ports:
    - name: dns-tcp
      port: {{ .Values.service.port }}
      targetPort: dns-tcp
      protocol: TCP
  selector:
    {{- include "coredns-netbox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
{{- end }}
