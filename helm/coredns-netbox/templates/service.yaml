apiVersion: v1
kind: Service
metadata:
  name: {{ include "coredns-netbox.fullname" . }}
  labels:
    {{- include "coredns-netbox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: dns-udp
      port: {{ .Values.service.port }}
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: {{ .Values.service.port }}
      targetPort: 53
      protocol: TCP
  selector:
    {{- include "coredns-netbox.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: primary
