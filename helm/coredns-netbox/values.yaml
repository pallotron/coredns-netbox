replicaCount: 1

coredns:
  image: ghcr.io/pallotron/coredns-netbox
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

sidecar:
  image: ghcr.io/pallotron/coredns-netbox-sidecar
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

zoneDiscovery:
  mode: zone-depth
  depth: 2

zoneDir: /zones

# Reverse DNS (PTR records)
reverseZones:
  enabled: true
  # Static parent zones that cover your IP space
  # IPv4 examples:
  #   10.in-addr.arpa - covers all of 10.0.0.0/8
  #   16.172.in-addr.arpa,17.172.in-addr.arpa - covers 172.16.0.0/16 and 172.17.0.0/16
  ipv4:
    - "10.in-addr.arpa"
    - "16.172.in-addr.arpa"
  # IPv6 examples (reverse nibble notation):
  #   b.8.0.d.0.1.2.0.ip6.arpa - covers 2001:db8::/32
  ipv6: []

netbox:
  url: http://netbox.netbox.svc.cluster.local
  # Set token directly, or use existingSecret to reference a pre-created Secret
  token: ""
  # Name of an existing Secret with a "token" key containing the Netbox API token
  existingSecret: ""

pollInterval: "60s"
ttl: 300

primaryNS: ns1.example.org.
adminEmail: admin.example.org.

pageSize: 1000
maxConcurrency: 10

# Enable the CoreDNS netbox plugin for live API fallthrough on cache misses.
# Only useful in dev — production relies on zone files from the sidecar.
netboxPlugin:
  enabled: false
  # Required when enabled. List the zones you are authoritative for (forward + reverse).
  # Queries outside these zones skip the netbox plugin and go straight to forward.
  zones: []

forwardServers:
  - 1.1.1.1
  - 8.8.8.8

# Primary: who can pull zones via AXFR
transfer:
  to: []
  # Production: ["10.0.1.5", "10.0.1.6"]
  # Dev: ["*"]

# Secondary
secondary:
  enabled: false
  zones: []
  transferFrom: []
  # Production example:
  #   zones: ["example.org", "internal.corp"]
  #   transferFrom: ["10.0.1.1"]
  hostPort:
    enabled: false
  # Service port for secondary (default 53, override in dev to avoid conflicts)
  servicePort: 53

service:
  type: ClusterIP
  port: 53

hostPort:
  enabled: true

resources:
  coredns:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  sidecar:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
