replicaCount: 1

zoneStorage:
  # Size limit for the emptyDir volume (used only when persistent: false).
  sizeLimit: 256Mi
  # Set to true to provision a PersistentVolumeClaim per pod via StatefulSet
  # volumeClaimTemplates (ReadWriteOnce). Recommended for production: zone files
  # survive pod restarts even when Netbox is temporarily unavailable.
  #
  # Requirements:
  #   - A dynamic storage provisioner with a default StorageClass must be present.
  #     GKE: standard-rwo (default) ✓  EKS: gp2 ✓  AKS: default ✓
  #     k3d/k3s: local-path (default) ✓
  #     Bare-metal without a provisioner: set storageClass explicitly or leave
  #     persistent: false and rely on Kubernetes CrashLoopBackOff + retries.
  #
  # IMPORTANT — breaking upgrade: switching from persistent: false to true
  # changes the workload kind from Deployment to StatefulSet. Before running
  # `helm upgrade`, delete the old Deployment to avoid a kind conflict:
  #   kubectl delete deployment <release-name> --cascade=orphan
  # The running pods are preserved (--cascade=orphan) while the StatefulSet
  # adopts them on the next rollout.
  persistent: false
  # StorageClass for the PVC. Leave empty to use the cluster default.
  # Set explicitly on bare-metal or when a specific tier is required, e.g.:
  #   storageClass: "premium-rwo"   # GKE SSD
  #   storageClass: "gp3"           # EKS
  storageClass: ""
  # PVC size per pod. Zone files are small (tens of KB even for large Netbox
  # installs); 1Gi is the minimum for most provisioners and more than enough.
  size: 1Gi
  # legacy: pre-created RWX PVC; leave empty when sidecar.standalone: true
  existingClaim: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Per-container security contexts
containerSecurityContext:
  coredns:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]
  sidecar:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  zoneInit:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

coredns:
  image: ghcr.io/pallotron/coredns-netbox
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  reloadGRPCPort: ":8054"          # gRPC port for ZoneReloadService
  reloadPollInterval: "60s"        # Fallback poll interval (0s to disable)
  # Extra CoreDNS plugin directives appended to the primary server block.
  # Use this to inject additional plugins (e.g. rewrite, acl, metadata) without
  # forking the chart. Each directive must be valid Corefile syntax.
  # Example — rewrite DC-labelled queries to the flat zone so that both
  # hostname.dc.domain and hostname.domain resolve from the same zone:
  #   extraConfig: |
  #     rewrite name regex ^([^.]+)\.([^.]+)\.example\.com\.$ {1}.example.com. answer auto
  extraConfig: ""

sidecar:
  image: ghcr.io/pallotron/coredns-netbox-sidecar
  tag: ""  # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent
  standalone: false   # Set true to run sidecar as a separate Deployment with dedicated RWO PVC
  reloadToken: ""   # Bearer token for CoreDNS gRPC reload endpoint; empty disables auth
  storage:
    storageClass: ""   # leave empty for cluster default; set e.g. "standard-rwo" on GKE
    size: 1Gi
  service:
    type: ClusterIP
    # In dev/CI, set type: LoadBalancer so k3d can route 18082/18083 via its loadbalancer
  # Additional environment variables for the sidecar container
  # Example:
  # env:
  #   - name: LOG_LEVEL
  #     value: "DEBUG"  # DEBUG, INFO (default), WARN, ERROR
  env: []

zoneDiscovery:
  mode: zone-depth
  depth: 2

zoneDir: /zones

# Reverse DNS (PTR records)
reverseZones:
  enabled: true
  # Static parent zones that cover your IP space
  # IPv4 examples:
  #   10.in-addr.arpa - covers all of 10.0.0.0/8
  #   16.172.in-addr.arpa,17.172.in-addr.arpa - covers 172.16.0.0/16 and 172.17.0.0/16
  ipv4:
    - "10.in-addr.arpa"
    - "16.172.in-addr.arpa"
  # IPv6 examples (reverse nibble notation):
  #   b.8.0.d.0.1.2.0.ip6.arpa - covers 2001:db8::/32
  ipv6: []

netbox:
  url: http://netbox.netbox.svc.cluster.local
  # Set token directly, or use existingSecret to reference a pre-created Secret
  token: ""
  # Name of an existing Secret with a "token" key containing the Netbox API token
  existingSecret: ""

pollInterval: "60s"
ttl: 300

primaryNS: ns1.example.org.
adminEmail: admin.example.org.

# SOA timers (seconds) for generated zones. refresh/retry control how often
# secondaries poll the primary for updates (no NOTIFY is sent, so refresh is
# the worst-case propagation delay to secondaries); expire is how long a
# secondary keeps serving the zone after the primary becomes unreachable.
soa:
  refresh: 3600
  retry: 900
  expire: 604800
  minimum: 86400

# DNS domain suffix for device-based record generation.
# Used to extract zones from device names (e.g., "dc1-site13a-r101-hv-01" → "dc1-site.{domainSuffix}").
# IMPORTANT: Set this to your actual domain (e.g., "infra.example.com") in production.
domainSuffix: example.org

# Strip the DC label (the label immediately before domainSuffix) from all DNS names fetched
# from Netbox before zone discovery. Useful when records are named host.dc.domain and you want
# a single zone for all DCs: host.dc.domain → host.domain.
# Requires domainSuffix to be set correctly.
stripDCLabel: false

# Device name parsing + templating (issue #60). When configured, device names
# matching one of the parsers (ordered, first match wins) get their canonical
# FQDN from nameFormats.canonical; each nameFormats.aliases entry becomes a
# CNAME pointing at the canonical. Devices matching no parser keep the legacy
# <device>.<zone> naming. Templates are Go text/template rendering COMPLETE
# FQDNs; capture groups are template variables, plus builtins {{.name}}
# (full device name) and {{.domain}} (domainSuffix above) and functions
# alphaPrefix/upper/lower. Validate a set before deploying with
# (repeat -name-parser / -name-alias as needed):
#   analyzer -file <netbox-ip-dump.json> -validate-name-formats \
#     -name-parser '<regex>' -name-canonical '<tmpl>' -name-alias '<tmpl>'
# Example:
#   deviceNameParsers:
#     - '^(?P<dc>[a-z0-9]+)-(?P<hall>[a-z]+[0-9][a-z0-9]*)-r(?P<rack>[0-9]+)-(?P<env>prod|mgmt|staging)-(?P<role>[a-z][a-z0-9-]*?)-(?P<idx>[0-9]+)$'
#   nameFormats:
#     zone: '{{.dc}}-{{alphaPrefix .hall}}.{{.domain}}'
#     canonical: '{{.name}}.{{template "zone" .}}'
#     aliases:
#       - '{{.role}}{{.idx}}-{{.dc}}-{{.hall}}-r{{.rack}}.{{template "zone" .}}'
deviceNameParsers: []
nameFormats:
  canonical: ""
  aliases: []
  zone: ""

pageSize: 1000
maxConcurrency: 10

# Interface categorization patterns (regex fragments joined with |).
# Each list entry is ORed together to form the final regex passed to the sidecar.
interfacePatterns:
  bmc:
    - "(?i)bmc"
    - "(?i)ipmi"
    - "(?i)ilo"
    - "(?i)idrac"
  loopback:
    - "^lo$"
    - "^lo0"
    - "^Loopback"
  dataplane:
    - "(?i)storage"
    - "(?i)vtep"
    - "(?i)vsan"
  mgmtVRF:
    - "(?i)mgmt"
    - "(?i)oob"
  management:
    - "(?i)mgmt"
    - "Management"
    - "fxp0"
    - "eth[01]"
    - "mgt"
    - "NET"
    - "^ens[0-9]"
    - "^eno[0-9]"
    - "^nic[0-9]"

forwardServers:
  - 1.1.1.1
  - 8.8.8.8

# Maximum TTL (seconds) for cached DNS responses (both positive and negative).
cacheTTL: 30

# Primary: who can pull zones via AXFR. Secondaries poll for updates on the
# SOA refresh interval; DNS NOTIFY is not sent on zone changes.
transfer:
  to: []
  # Production: ["10.0.1.5", "10.0.1.6"]
  # Dev: ["*"]

# Secondary
secondary:
  enabled: false
  replicaCount: 1
  zones: []
  transferFrom: []
  # Production example:
  #   zones: ["example.org", "internal.corp"]
  #   transferFrom: ["10.0.1.1"]
  hostPort:
    enabled: false
  # Service port for secondary (default 53, override in dev to avoid conflicts)
  servicePort: 53
  # Service type for the secondary DNS service. LoadBalancer exposes it via a
  # cloud LB or k3s svclb. Set to ClusterIP if external access is not needed.
  serviceType: LoadBalancer

metrics:
  enabled: true
  port: 9153
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

pdb:
  enabled: true
  minAvailable: 1

service:
  port: 53
  annotations: {}
  # External service — exposes TCP/53 only for DC secondaries (AXFR).
  # Kept separate from the ClusterIP service so internal ports (gRPC, metrics,
  # health) are never exposed outside the cluster.
  external:
    enabled: false
    type: LoadBalancer
    annotations: {}
    # Expose CoreDNS gRPC reload port on the external service.
    # Enable in dev/CI so e2e tests can reach the reload endpoint from the host.
    # Leave false in production.
    exposeGRPCReload: false

networkPolicy:
  enabled: false   # Set true to restrict sidecar traffic to coredns-netbox pods only (requires CNI support)

hostPort:
  enabled: false
  # Enable hostPort for sidecar ports (8082 metrics, 8083 gRPC) on the k3d node.
  # Required in k3d dev so the e2e test process can reach the sidecar from the host.
  # Leave false in production — access goes through the ClusterIP service instead.
  sidecar: false

resources:
  coredns:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  sidecar:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  zoneInit:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  secondary:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
