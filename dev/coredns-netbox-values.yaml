# Dev-specific values for coredns-netbox helm chart
# Used by k3d cluster for local development

# Two replicas — validates multi-replica DNS serving and gRPC zone reload propagation
replicaCount: 2

# Use locally built images (imported into k3d via `make dev.images`)
coredns:
  image: coredns-netbox
  tag: dev
  pullPolicy: IfNotPresent
  # Rewrite DC-labelled queries to the flat zone so both
  # server1-mgmt.dc1.mycompany.com and server1-mgmt.mycompany.com resolve.
  extraConfig: |
    rewrite name regex ^([^.]+)\.([^.]+)\.mycompany\.com\.$ {1}.mycompany.com. answer auto

sidecar:
  image: coredns-netbox-sidecar
  tag: dev
  pullPolicy: IfNotPresent
  standalone: true
  service:
    type: LoadBalancer   # k3d routes 18082/18083 via its loadbalancer (no hostPort needed)
  env:
    - name: GRPC_ADDR
      value: ":8083"
    - name: GRPC_AUTH_TOKEN
      value: "devtoken"

# Static ClusterIP for reproducible secondary configuration in e2e tests
service:
  clusterIP: 10.43.100.53
  # Enable external service for k3d port forwarding in e2e tests
  external:
    enabled: true
    type: LoadBalancer
    annotations: {}
    # Expose CoreDNS gRPC reload port so TestZoneReloadService can reach it from host
    exposeGRPCReload: true

# No hostPort needed — sidecar is now a standalone Deployment with its own
# LoadBalancer Service. k3d routes 18082/18083 through the service, not hostPort.
hostPort:
  enabled: false
  sidecar: false

# Concurrency and discovery settings
maxConcurrency: 3
zoneDiscovery:
  depth: 2

# Strip DC label: server1-mgmt.dc1.mycompany.com → server1-mgmt.mycompany.com
stripDCLabel: true
domainSuffix: mycompany.com

# DNS metadata
primaryNS: ns1.mycompany.com.
adminEmail: admin.mycompany.com.

# Reduce cache TTL for dev/e2e: ensures CoreDNS reload (10s) outlasts any
# cached positive or negative answer, so DNS checks after forceMerge are fresh.
cacheTTL: 5

# Allow zone transfers to anyone in dev
transfer:
  to:
    - '*'

# Reverse DNS zones
reverseZones:
  enabled: true
  ipv4:
    - 10.in-addr.arpa

# Secondary DNS server
secondary:
  enabled: true
  # Use port 5354 to match k3d port mapping (avoids conflict with primary on 53)
  servicePort: 5354
  hostPort:
    enabled: false
  zones:
    - mycompany.com
    - 10.in-addr.arpa
  # Transfer zones from primary (using static ClusterIP above)
  transferFrom:
    - 10.43.100.53

# Shared RWX zone storage for standalone sidecar mode.
# The PV/PVC is created by `make dev.zones-pv` (dev/coredns-zones-pv.yaml).
# Uses hostPath on the single k3d node — works for dev/CI, not for production.
zoneStorage:
  existingClaim: coredns-zones
