# Dev-specific values for coredns-netbox helm chart
# Used by k3d cluster for local development

# Use locally built images (imported into k3d via `make dev.images`)
coredns:
  image: coredns-netbox
  tag: dev
  pullPolicy: IfNotPresent

sidecar:
  image: coredns-netbox-sidecar
  tag: dev
  pullPolicy: IfNotPresent
  env:
    - name: GRPC_ADDR
      value: ":8083"
    - name: GRPC_AUTH_TOKEN
      value: "devtoken"

# Static ClusterIP for reproducible secondary configuration in e2e tests
service:
  clusterIP: 10.43.100.53
  # Enable external service for k3d port forwarding in e2e tests
  external:
    enabled: true
    type: LoadBalancer
    annotations: {}

# Disable hostPort in dev (conflicts with LoadBalancer svclb pods)
hostPort:
  enabled: false

# Concurrency and discovery settings
maxConcurrency: 3
zoneDiscovery:
  depth: 2

# Strip DC label: server1-mgmt.dc1.mycompany.com → server1-mgmt.mycompany.com
stripDCLabel: true
domainSuffix: mycompany.com

# DNS metadata
primaryNS: ns1.mycompany.com.
adminEmail: admin.mycompany.com.

# Reduce cache TTL for dev/e2e: ensures CoreDNS reload (10s) outlasts any
# cached positive or negative answer, so DNS checks after forceMerge are fresh.
cacheTTL: 5

# Allow zone transfers to anyone in dev
transfer:
  to:
    - '*'

# Reverse DNS zones
reverseZones:
  enabled: true
  ipv4:
    - 10.in-addr.arpa

# Secondary DNS server
secondary:
  enabled: true
  # Use port 5354 to match k3d port mapping (avoids conflict with primary on 53)
  servicePort: 5354
  hostPort:
    enabled: false
  zones:
    - mycompany.com
    - 10.in-addr.arpa
  # Transfer zones from primary (using static ClusterIP above)
  transferFrom:
    - 10.43.100.53
