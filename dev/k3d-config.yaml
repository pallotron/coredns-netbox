apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: coredns-netbox
servers: 1
agents: 0
ports:
  - port: 15353:53/tcp
    nodeFilters:
      - loadbalancer
  - port: 15353:53/udp
    nodeFilters:
      - loadbalancer
  - port: 15354:5354/tcp
    nodeFilters:
      - loadbalancer
  - port: 15354:5354/udp
    nodeFilters:
      - loadbalancer
  - port: 18082:8082/tcp
    nodeFilters:
      - loadbalancer
  - port: 18083:8083/tcp
    nodeFilters:
      - loadbalancer
  - port: 18054:8054/tcp
    nodeFilters:
      - loadbalancer
  # Per-pod DNS ports for explicit per-replica e2e testing
  - port: 15360:30060/tcp
    nodeFilters:
      - loadbalancer
  - port: 15361:30061/tcp
    nodeFilters:
      - loadbalancer
options:
  k3d:
    wait: true
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
