# Per-pod NodePort services for direct DNS testing of each replica.
# Allows e2e tests to verify each CoreDNS pod individually, not just via
# the load-balanced service. k3d forwards 15360→pod-0 and 15361→pod-1.
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-netbox-primary-0
  namespace: coredns-netbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: coredns-netbox
    app.kubernetes.io/instance: coredns-netbox
    app.kubernetes.io/component: primary
    statefulset.kubernetes.io/pod-name: coredns-netbox-0
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      nodePort: 30060
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-netbox-primary-1
  namespace: coredns-netbox
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: coredns-netbox
    app.kubernetes.io/instance: coredns-netbox
    app.kubernetes.io/component: primary
    statefulset.kubernetes.io/pod-name: coredns-netbox-1
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      nodePort: 30061
      protocol: TCP
