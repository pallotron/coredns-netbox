name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0, without the v prefix)'
        required: true
      skip_e2e:
        description: 'Skip E2E tests (not recommended for releases)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    # Run on tag pushes, or on manual trigger when skip_e2e is false
    if: github.event_name == 'push' || !inputs.skip_e2e
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install k3d, kubectl, and helm
        run: |
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Setup dev environment and run E2E tests
        run: |
          make dev
          make test.e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump

          echo "=== Netbox Pods ==="
          kubectl get pods -n netbox
          kubectl describe pods -n netbox

          echo "=== CoreDNS Pods ==="
          kubectl get pods -n coredns-netbox
          kubectl describe pods -n coredns-netbox

          echo "=== Netbox Logs ==="
          kubectl logs -n netbox deploy/netbox -c netbox --tail=100 || true

          echo "=== CoreDNS Logs ==="
          kubectl logs -n coredns-netbox deploy/coredns-netbox --all-containers --tail=100 || true

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            /tmp/k3d-*.log
          retention-days: 7

  publish-images:
    needs: [e2e-tests]
    # Run if E2E passed OR was skipped (but not if cancelled/failed)
    if: always() && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CoreDNS image
        uses: docker/build-push-action@v6
        with:
          context: coredns/
          file: coredns/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/coredns-netbox:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.OWNER }}/coredns-netbox:latest

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/coredns-netbox-sidecar:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.OWNER }}/coredns-netbox-sidecar:latest

  publish-chart:
    needs: [e2e-tests]
    # Run if E2E passed OR was skipped (but not if cancelled/failed)
    if: always() && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Stamp chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" helm/coredns-netbox/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" helm/coredns-netbox/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package helm/coredns-netbox
          helm push coredns-netbox-${{ steps.version.outputs.VERSION }}.tgz \
            oci://ghcr.io/${{ env.OWNER }}/charts
