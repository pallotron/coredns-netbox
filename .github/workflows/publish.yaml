name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0, without the v prefix)'
        required: true

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install k3d, kubectl, and helm
        run: |
          # Install k3d
          curl -s https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | bash

          # Install kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

          # Install helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Create k3d cluster
        run: |
          # Use /tmp for pgdata instead of HOME to avoid permission issues
          mkdir -p /tmp/pgdata

          # Create modified k3d config using /tmp
          sed 's|${HOME}/.local/share/coredns-netbox/pgdata:/pgdata|/tmp/pgdata:/pgdata|' \
            dev/k3d-config.yaml > /tmp/k3d-config.yaml

          k3d cluster create --config /tmp/k3d-config.yaml
          kubectl cluster-info

      - name: Deploy PostgreSQL PV/PVC
        run: |
          kubectl create namespace netbox --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f dev/postgres-pv.yaml
          kubectl wait --for=condition=ready --timeout=2m -n netbox pvc/data-netbox-postgresql-0

      - name: Deploy Netbox
        run: |
          helm repo add netbox-community https://netbox-community.github.io/netbox-chart/
          helm repo update

          kubectl apply -f dev/netbox-extra-configmap.yaml

          # Deploy with 15m timeout (plan recommendation)
          helm upgrade --install netbox netbox-community/netbox \
            -n netbox \
            -f dev/netbox-values.yaml \
            --wait --timeout 15m

      - name: Wait for Netbox to be ready
        run: |
          echo "Waiting for Netbox deployment to be fully ready..."
          kubectl wait --for=condition=available --timeout=5m -n netbox deployment/netbox

          # Give it extra time for internal readiness
          sleep 30

      - name: Create Netbox API token
        run: |
          echo "Creating Netbox API token..."
          SCRIPT=$(cat dev/create-token.py)
          NETBOX_TOKEN=$(kubectl exec -n netbox deploy/netbox -c netbox -- \
            python /opt/netbox/netbox/manage.py shell --no-startup --no-imports \
            -c "$SCRIPT" \
            2>/dev/null | grep '^nbt_')

          echo "Token created successfully"

          # Store token in secrets for both namespaces
          kubectl create namespace coredns-netbox --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic netbox-api-token \
            -n netbox \
            --from-literal=token="$NETBOX_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic netbox-api-token \
            -n coredns-netbox \
            --from-literal=token="$NETBOX_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Seed test data
        run: |
          echo "Seeding Netbox with IP addresses..."
          SCRIPT=$(cat dev/seed-ips.py)
          kubectl exec -n netbox deploy/netbox -c netbox -- \
            python /opt/netbox/netbox/manage.py shell --no-startup --no-imports \
            -c "$SCRIPT"

      - name: Build and import Docker images
        run: |
          # Build CoreDNS image
          docker build -t coredns-netbox:dev -f coredns/Dockerfile coredns/
          k3d image import coredns-netbox:dev -c coredns-netbox

          # Build sidecar image
          docker build -t coredns-netbox-sidecar:dev -f docker/sidecar/Dockerfile .
          k3d image import coredns-netbox-sidecar:dev -c coredns-netbox

      - name: Deploy CoreDNS Helm chart
        run: |
          helm upgrade --install coredns-netbox ./helm/coredns-netbox \
            -n coredns-netbox \
            -f dev/coredns-netbox-values.yaml \
            --set netbox.existingSecret=netbox-api-token \
            --wait --timeout 5m

      - name: Wait for DNS services to be ready
        run: |
          echo "Waiting for CoreDNS to be fully ready..."
          kubectl wait --for=condition=available --timeout=3m -n coredns-netbox deployment/coredns-netbox
          sleep 10

      - name: Run E2E tests
        run: make test.e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump

          echo "=== Netbox Pods ==="
          kubectl get pods -n netbox
          kubectl describe pods -n netbox

          echo "=== CoreDNS Pods ==="
          kubectl get pods -n coredns-netbox
          kubectl describe pods -n coredns-netbox

          echo "=== Netbox Logs ==="
          kubectl logs -n netbox deploy/netbox -c netbox --tail=100 || true

          echo "=== CoreDNS Logs ==="
          kubectl logs -n coredns-netbox deploy/coredns-netbox --all-containers --tail=100 || true

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: |
            /tmp/k3d-*.log
          retention-days: 7

  publish-images:
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push CoreDNS image
        uses: docker/build-push-action@v6
        with:
          context: coredns/
          file: coredns/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/coredns-netbox:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.OWNER }}/coredns-netbox:latest

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.OWNER }}/coredns-netbox-sidecar:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ env.OWNER }}/coredns-netbox-sidecar:latest

  publish-chart:
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Stamp chart version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.VERSION }}/" helm/coredns-netbox/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" helm/coredns-netbox/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package helm/coredns-netbox
          helm push coredns-netbox-${{ steps.version.outputs.VERSION }}.tgz \
            oci://ghcr.io/${{ env.OWNER }}/charts
