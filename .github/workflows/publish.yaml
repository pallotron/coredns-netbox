name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.2.0, without the v prefix)'
        required: true
      skip_e2e:
        description: 'Skip E2E tests (not recommended for releases)'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-images-for-e2e:
    # Run on tag pushes, or on manual trigger when skip_e2e is false
    if: github.event_name == 'push' || !inputs.skip_e2e
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    secrets: inherit
    with:
      coredns-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox:ci-${{ github.run_id }}
      sidecar-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:ci-${{ github.run_id }}

  e2e-tests:
    needs: [build-images-for-e2e]
    if: always() && needs.build-images-for-e2e.result == 'success'
    permissions:
      packages: read
    uses: ./.github/workflows/e2e.yaml
    with:
      image_tag: ci-${{ github.run_id }}

  cleanup-e2e-images:
    needs: [build-images-for-e2e, e2e-tests]
    if: always() && needs.build-images-for-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete E2E images
        run: |
          TAG="ci-${{ github.run_id }}"
          for pkg in coredns-netbox coredns-netbox-sidecar; do
            gh api "/user/packages/container/${pkg}/versions" \
              --jq --arg tag "$TAG" \
              '.[] | select(.metadata.container.tags | map(select(. == $tag)) | length > 0) | .id' \
              | while read -r id; do
                gh api --method DELETE "/user/packages/container/${pkg}/versions/${id}" \
                  && echo "Deleted ${pkg}:${TAG} (version ${id})" \
                  || true
              done
          done

  extract-version:
    needs: [e2e-tests]
    if: always() && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Extract version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

  publish-images:
    needs: [extract-version]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    secrets: inherit
    with:
      coredns-tags: |
        ghcr.io/${{ github.repository_owner }}/coredns-netbox:${{ needs.extract-version.outputs.version }}
        ghcr.io/${{ github.repository_owner }}/coredns-netbox:latest
      sidecar-tags: |
        ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:${{ needs.extract-version.outputs.version }}
        ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:latest
      platforms: linux/amd64,linux/arm64

  publish-chart:
    needs: [e2e-tests, extract-version, publish-images]
    # Run if E2E passed OR was skipped, and images published successfully
    if: always() && (needs.e2e-tests.result == 'success' || needs.e2e-tests.result == 'skipped') && needs.publish-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Stamp chart version
        run: |
          sed -i "s/^version:.*/version: ${{ needs.extract-version.outputs.version }}/" helm/coredns-netbox/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ needs.extract-version.outputs.version }}\"/" helm/coredns-netbox/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package helm/coredns-netbox
          helm push coredns-netbox-${{ needs.extract-version.outputs.version }}.tgz \
            oci://ghcr.io/${{ env.OWNER }}/charts
