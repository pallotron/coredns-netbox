name: E2E Tests

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Pre-built image tag in GHCR (e.g. ci-123456).'
        type: string
        required: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          skip-creation: true

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/coredns-netbox:${{ inputs.image_tag }}
          docker tag  ghcr.io/${{ github.repository_owner }}/coredns-netbox:${{ inputs.image_tag }} coredns-netbox:dev
          docker pull ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:${{ inputs.image_tag }}
          docker tag  ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:${{ inputs.image_tag }} coredns-netbox-sidecar:dev

      - name: Setup dev environment and run E2E tests
        run: |
          make dev.cluster
          k3d image import coredns-netbox:dev -c coredns-netbox
          k3d image import coredns-netbox-sidecar:dev -c coredns-netbox
          make dev.netbox dev.token dev.seed dev.deploy
          make dev.wait
          make test.e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump

          echo "=== Netbox Pods ==="
          kubectl get pods -n netbox
          kubectl describe pods -n netbox

          echo "=== CoreDNS Pods ==="
          kubectl get pods -n coredns-netbox
          kubectl describe pods -n coredns-netbox

          echo "=== Netbox Logs ==="
          kubectl logs -n netbox deploy/netbox -c netbox --tail=100 || true

          echo "=== CoreDNS Logs ==="
          kubectl logs -n coredns-netbox -l app.kubernetes.io/component=primary --all-containers --tail=100 || true

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/k3d-*.log
          retention-days: 7
