name: E2E Tests

on:
  workflow_call:
    inputs:
      image_tag:
        description: 'Pre-built image tag in GHCR (e.g. ci-123456).'
        type: string
        required: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install k3d
        uses: nolar/setup-k3d-k3s@v1
        with:
          skip-creation: true
          # The action resolves k3s/k3d versions via the GitHub releases API;
          # unauthenticated calls get rate-limited (curl 403) on busy runners.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images from GHCR
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/coredns-netbox:${{ inputs.image_tag }}
          docker tag  ghcr.io/${{ github.repository_owner }}/coredns-netbox:${{ inputs.image_tag }} coredns-netbox:dev
          docker pull ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:${{ inputs.image_tag }}
          docker tag  ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:${{ inputs.image_tag }} coredns-netbox-sidecar:dev

      - name: Setup dev environment and run E2E tests
        run: |
          make dev.cluster
          k3d image import coredns-netbox:dev -c coredns-netbox
          k3d image import coredns-netbox-sidecar:dev -c coredns-netbox
          make dev.netbox dev.token dev.seed dev.deploy
          make dev.wait
          make test.e2e
          make test.e2e.chaos

      - name: Collect diagnostics on failure
        if: failure()
        run: ./dev/collect-diagnostics.sh "$RUNNER_TEMP/e2e-diag"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: ${{ runner.temp }}/e2e-diag
          retention-days: 7
