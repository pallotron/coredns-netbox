name: E2E Tests

on:
  workflow_call:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install k3d
        uses: medyagh/setup-k3d@v0.0.7

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install helm
        uses: azure/setup-helm@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build coredns image
        uses: docker/build-push-action@v6
        with:
          context: coredns/
          file: coredns/Dockerfile
          load: true
          tags: coredns-netbox:dev
          cache-from: type=gha,scope=coredns
          cache-to: type=gha,mode=max,scope=coredns

      - name: Build sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar/Dockerfile
          load: true
          tags: coredns-netbox-sidecar:dev
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar

      - name: Setup dev environment and run E2E tests
        run: |
          make dev.cluster
          k3d image import coredns-netbox:dev -c coredns-netbox
          k3d image import coredns-netbox-sidecar:dev -c coredns-netbox
          make dev.netbox dev.token dev.seed dev.deploy
          make dev.wait
          make test.e2e

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info dump

          echo "=== Netbox Pods ==="
          kubectl get pods -n netbox
          kubectl describe pods -n netbox

          echo "=== CoreDNS Pods ==="
          kubectl get pods -n coredns-netbox
          kubectl describe pods -n coredns-netbox

          echo "=== Netbox Logs ==="
          kubectl logs -n netbox deploy/netbox -c netbox --tail=100 || true

          echo "=== CoreDNS Logs ==="
          kubectl logs -n coredns-netbox -l app.kubernetes.io/component=primary --all-containers --tail=100 || true

      - name: Upload logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/k3d-*.log
          retention-days: 7
