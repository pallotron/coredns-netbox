name: PR Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-images:
    # Only build when PR is open (not closed)
    if: github.event.action != 'closed'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    secrets: inherit
    with:
      coredns-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox:pr-${{ github.event.pull_request.number }}
      sidecar-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:pr-${{ github.event.pull_request.number }}

  comment-pr:
    needs: [build-images]
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const comment = `## 🐳 PR Images Built

            Images for this PR are now available:

            **Sidecar:**
            \`\`\`yaml
            sidecar:
              image: ghcr.io/${owner}/coredns-netbox-sidecar
              tag: pr-${prNumber}
            \`\`\`

            **CoreDNS:**
            \`\`\`yaml
            coredns:
              image: ghcr.io/${owner}/coredns-netbox
              tag: pr-${prNumber}
            \`\`\`

            **Test with helm:**
            \`\`\`bash
            helm upgrade coredns-netbox ./helm/coredns-netbox \\
              --namespace coredns-netbox \\
              --set sidecar.tag=pr-${prNumber} \\
              --set coredns.tag=pr-${prNumber}
            \`\`\`

            Images will be automatically deleted when this PR is closed.
            `;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('PR Images Built')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: comment,
              });
            }

  cleanup-images:
    # Only run when PR is closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR images
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          echo "Deleting images for PR #${PR_NUMBER}..."

          # Note: This requires the gh CLI and proper permissions
          # Images are typically cleaned up automatically by GHCR retention policies
          # This is a best-effort cleanup

          echo "✓ PR closed - images will be cleaned up by GHCR retention policies"
          echo "  (or manually via: gh api --method DELETE /orgs/${OWNER}/packages/container/coredns-netbox-sidecar/versions/<version-id>)"
