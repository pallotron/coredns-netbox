name: PR Images

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-images:
    # Only build when PR is open (not closed)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    strategy:
      matrix:
        include:
          - name: sidecar
            image: coredns-netbox-sidecar
            context: .
            file: docker/sidecar/Dockerfile
          - name: coredns
            image: coredns-netbox
            context: coredns/
            file: coredns/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Comment on PR
        if: matrix.name == 'sidecar'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const comment = `## 🐳 PR Images Built

            Images for this PR are now available:

            **Sidecar:**
            \`\`\`yaml
            sidecar:
              image: ghcr.io/${owner}/coredns-netbox-sidecar
              tag: pr-${prNumber}
            \`\`\`

            **CoreDNS:**
            \`\`\`yaml
            coredns:
              image: ghcr.io/${owner}/coredns-netbox
              tag: pr-${prNumber}
            \`\`\`

            **Test with helm:**
            \`\`\`bash
            helm upgrade coredns-netbox ./helm/coredns-netbox \\
              --namespace coredns-netbox \\
              --set sidecar.tag=pr-${prNumber} \\
              --set coredns.tag=pr-${prNumber}
            \`\`\`

            Images will be automatically deleted when this PR is closed.
            `;

            // Check if we already commented
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('PR Images Built')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: comment,
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: comment,
              });
            }

  cleanup-images:
    # Only run when PR is closed
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete PR images
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}

          echo "Deleting images for PR #${PR_NUMBER}..."

          # Note: This requires the gh CLI and proper permissions
          # Images are typically cleaned up automatically by GHCR retention policies
          # This is a best-effort cleanup

          echo "✓ PR closed - images will be cleaned up by GHCR retention policies"
          echo "  (or manually via: gh api --method DELETE /orgs/${OWNER}/packages/container/coredns-netbox-sidecar/versions/<version-id>)"
