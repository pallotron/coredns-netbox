name: Build and Push Images (reusable)
# Single source of truth for Docker image builds.
# Callers pass tags; build context and Dockerfile paths are defined here.

on:
  workflow_call:
    inputs:
      coredns-tags:
        description: Newline-separated tags for the CoreDNS image
        required: true
        type: string
      sidecar-tags:
        description: Newline-separated tags for the sidecar image
        required: true
        type: string
      platforms:
        description: Target platforms (e.g. linux/amd64 or linux/amd64,linux/arm64)
        required: false
        type: string
        default: linux/amd64

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CoreDNS image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: coredns/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.coredns-tags }}
          cache-from: type=gha,scope=coredns
          cache-to: type=gha,mode=max,scope=coredns

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/sidecar/Dockerfile
          push: true
          platforms: ${{ inputs.platforms }}
          tags: ${{ inputs.sidecar-tags }}
          cache-from: type=gha,scope=sidecar
          cache-to: type=gha,mode=max,scope=sidecar
