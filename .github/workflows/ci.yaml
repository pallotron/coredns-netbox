name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: make test.unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: make lint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Helm chart tests
        run: make test.helm

  build-images:
    # Only on PRs: build and push to GHCR so e2e can pull instead of rebuilding
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    secrets: inherit
    with:
      coredns-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox:ci-${{ github.run_id }}
      sidecar-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:ci-${{ github.run_id }}

  e2e:
    needs: [build-images]
    # Run if build-images succeeded (PR) or was skipped (push to main)
    if: always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    permissions:
      packages: read
    uses: ./.github/workflows/e2e.yaml
    with:
      image_tag: ${{ needs.build-images.result == 'success' && format('ci-{0}', github.run_id) || '' }}
