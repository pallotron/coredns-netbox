name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run unit tests
        run: make test.unit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: make lint

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run Helm chart tests
        run: make test.helm

  build-images:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build-images.yaml
    secrets: inherit
    with:
      coredns-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox:ci-${{ github.run_id }}
      sidecar-tags: ghcr.io/${{ github.repository_owner }}/coredns-netbox-sidecar:ci-${{ github.run_id }}

  e2e:
    needs: [build-images]
    permissions:
      packages: read
    uses: ./.github/workflows/e2e.yaml
    with:
      image_tag: ci-${{ github.run_id }}

  cleanup-ci-images:
    needs: [build-images, e2e]
    if: always() && needs.build-images.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Delete CI images
        run: |
          TAG="ci-${{ github.run_id }}"
          for pkg in coredns-netbox coredns-netbox-sidecar; do
            gh api "/user/packages/container/${pkg}/versions" \
              --jq --arg tag "$TAG" \
              '.[] | select(.metadata.container.tags | map(select(. == $tag)) | length > 0) | .id' \
              | while read -r id; do
                gh api --method DELETE "/user/packages/container/${pkg}/versions/${id}" \
                  && echo "Deleted ${pkg}:${TAG} (version ${id})" \
                  || true
              done
          done
